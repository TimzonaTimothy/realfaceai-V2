name: realfaceai
description: "RealFaceAI — realtime face streaming studio. https://realfaceai.app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^13.2.0

  # State management
  provider: ^6.1.2

  # Charts (usage dashboard)
  fl_chart: ^0.67.0

  # UI extras
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4
  url_launcher: ^6.2.5
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  lucide_icons:

  # Clipboard
  clipboard: ^0.1.3

  # QR code display for crypto payments
  qr_flutter: ^4.1.0

  # File picking (face swap image upload)
  file_picker: ^8.0.3
  dotted_border: ^2.1.0
  image_picker: ^1.1.2

  # WebView — desktop realtime streaming (Xmax web SDK in the page)
  flutter_inappwebview: ^6.1.0
  camera: ^0.10.5+9

  cupertino_icons: ^1.0.8
  package_info_plus: ^8.0.0
  open_filex: ^4.3.4
  path_provider: ^2.1.4
  intl: ^0.20.2
  xmax_sdk: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  msix: ^3.16.13

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 26
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"

msix_config:
  display_name: RealFaceAI
  publisher_display_name: Timzona Timothy
  identity_name: app.realfaceai.desktop
  msix_version: 1.0.0.0
  logo_path: windows\runner\resources\app_icon.ico

flutter:
  uses-material-design: true

  assets:
    - assets/js/rt.js
    - assets/js/frame-metadata-worker.js
    - assets/brand/
    - assets/icon/app_icon.png
    - assets/images/logo.png
    - assets/images/logo_transparent_512x512.png
    - assets/images/logo_transparent_800x340.png
    

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
